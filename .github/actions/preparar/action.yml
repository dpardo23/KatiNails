name: preparar
description: Herramientas de mise.toml, caché del store de pnpm e instalación con el lockfile congelado

inputs:
  herramientas:
    description: Herramientas de mise.toml que necesita el job, separadas por espacios
    required: true
  instalar-dependencias:
    description: Si corre pnpm install
    default: 'true'

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        install_args: ${{ inputs.herramientas }}
    - name: Ruta del store de pnpm
      if: inputs.instalar-dependencias == 'true'
      id: store
      shell: bash
      run: echo "ruta=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      if: inputs.instalar-dependencias == 'true'
      with:
        path: ${{ steps.store.outputs.ruta }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Dependencias
      if: inputs.instalar-dependencias == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
