name: Bug
description: Algo no funciona como debería
title: '<qué falla> <dónde> <cuándo>'
labels: ['tipo:bug']
body:
  - type: markdown
    attributes:
      value: Sin datos de clientas ni del personal. Las capturas, con datos de prueba.
  - type: input
    id: afectado
    attributes:
      label: HU o RF afectado
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: [Crítica, Alta, Media, Baja]
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: staging, Chrome 130, Android 14
    validations:
      required: true
