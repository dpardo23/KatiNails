version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels: [dependencias]
    commit-message:
      prefix: build
      include: scope
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # TypeScript se queda en 6.0.x: typescript-eslint pide < 6.1
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Los tipos de Node siguen a la versión de Node de mise.toml (24): la mayor la cambia una persona.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels: [dependencias]
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns: ['*']
