name: etiquetas-pr

# Sin pull_request_target: el código de un PR externo nunca corre con permisos de escritura ni secretos.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  etiquetar:
    # Dependabot pone su propia etiqueta y su token es de solo lectura.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
