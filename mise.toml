# Versiones de las herramientas: fuente única para el entorno local y el CI.
# Las cambia una persona, no Dependabot.
# En local se usa siempre con `source ./.entorno` (todo queda en .herramientas/).

min_version = "2026.11.0"

[settings]
lockfile = true            # mise.lock guarda las URL y las sumas de verificación
not_found_auto_install = false

[tools]
node = "24.22.3"           # LTS Krypton (parche de seguridad del 10 nov 2026)
pnpm = "12.17.0"
supabase = "2.122.1"       # CLI de Supabase
java = "temurin-21.0.13.1+2.0.LTS" # build de Android (Capacitor 8)
deno = "2.9.8"             # comprobar las Edge Functions en local (⚠ runtime de Supabase)
age = "1.3.2"              # cifrado de respaldos
gitleaks = "8.30.1"        # hook pre-commit y CI
actionlint = "1.7.12"      # sintaxis de los workflows
zizmor = "1.32.0"          # seguridad de los workflows
shellcheck = "0.11.0"      # scripts y hooks
lychee = "0.24.2"          # enlaces de los .md
osv-scanner = "2.7.1"      # vulnerabilidades de dependencias (CI)
"github:sbdchd/squawk" = "2.72.0" # lint de migraciones de Postgres
# Bitwarden CLI oficial: el paquete del sistema quedó en 2026.2.0.
"github:bitwarden/clients" = { version = "2026.10.1", version_prefix = "cli-v", bin = "bw", platforms = { linux-x64 = { asset_pattern = "bw-linux-[0-9]*.zip" }, linux-arm64 = { asset_pattern = "bw-linux-arm64-*.zip" }, macos-x64 = { asset_pattern = "bw-macos-[0-9]*.zip" }, macos-arm64 = { asset_pattern = "bw-macos-arm64-*.zip" }, windows-x64 = { asset_pattern = "bw-windows-*.zip" } } }

[env]
_.file = { path = ".env.local", redact = true }
