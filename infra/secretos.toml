# Mapa de secretos, sin valores. Lo leen las tareas entorno:env, secretos:github y secretos:supabase.
#
# Cada línea: VARIABLE = "<origen>:<dónde>"
#   bitwarden:<Entrada>   campo oculto VARIABLE de la entrada <Entrada>, en la carpeta «Katinails».
#                         Nombre de la entrada: "Servicio · recurso", más " · entorno" (desarrollo, staging o
#                         produccion) cuando hay una entrada por entorno.
#   supabase:<CAMPO>[/ruta] valor de `supabase status -o env` (solo [local]), con una ruta opcional al final
#   fijo:<valor>          valor público y documentado (claves de prueba)
#
# [local] y .env.example tienen los mismos nombres (lo revisa el CI). Lo local nunca usa valores de producción.

[local]
VITE_SUPABASE_URL = "supabase:API_URL"
VITE_SUPABASE_PUBLISHABLE_KEY = "supabase:PUBLISHABLE_KEY"
VITE_API_URL = "supabase:FUNCTIONS_URL/api"
VITE_GOOGLE_CLIENT_ID = "bitwarden:Google · OAuth · desarrollo"
# Clave de prueba de Turnstile que siempre pasa (documentación de Cloudflare)
VITE_TURNSTILE_SITE_KEY = "fijo:1x00000000000000000000AA"
VITE_SENTRY_DSN = "bitwarden:Sentry · DSN · desarrollo"

[github.staging]
SUPABASE_ACCESS_TOKEN = "bitwarden:Supabase · token de despliegue"
SUPABASE_PROJECT_REF = "bitwarden:Supabase · proyecto · staging"
SUPABASE_DB_PASSWORD = "bitwarden:Supabase · proyecto · staging"
CLOUDFLARE_API_TOKEN = "bitwarden:Cloudflare · token de despliegue"
CLOUDFLARE_ACCOUNT_ID = "bitwarden:Cloudflare · token de despliegue"

[github.produccion]
SUPABASE_ACCESS_TOKEN = "bitwarden:Supabase · token de despliegue"
SUPABASE_PROJECT_REF = "bitwarden:Supabase · proyecto · produccion"
SUPABASE_DB_PASSWORD = "bitwarden:Supabase · proyecto · produccion"
CLOUDFLARE_API_TOKEN = "bitwarden:Cloudflare · token de despliegue"
CLOUDFLARE_ACCOUNT_ID = "bitwarden:Cloudflare · token de despliegue"
ANDROID_KEYSTORE_BASE64 = "bitwarden:Android · llave de firma"
ANDROID_KEYSTORE_PASSWORD = "bitwarden:Android · llave de firma"
ANDROID_KEY_ALIAS = "bitwarden:Android · llave de firma"
ANDROID_KEY_PASSWORD = "bitwarden:Android · llave de firma"
LIVE_UPDATE_PRIVATE_KEY = "bitwarden:Capawesome · llave de firma"

[github.respaldo]
BACKUP_DATABASE_URL = "bitwarden:Supabase · respaldo · produccion"
BACKUP_STORAGE_EMAIL = "bitwarden:Supabase · respaldo · produccion"
BACKUP_STORAGE_PASSWORD = "bitwarden:Supabase · respaldo · produccion"
R2_ACCOUNT_ID = "bitwarden:Cloudflare · R2 respaldos base"
R2_ACCESS_KEY_ID = "bitwarden:Cloudflare · R2 respaldos base"
R2_SECRET_ACCESS_KEY = "bitwarden:Cloudflare · R2 respaldos base"
AGE_PUBLIC_KEY = "bitwarden:age · respaldos"

[github.respaldo-staging]
BACKUP_DATABASE_URL = "bitwarden:Supabase · respaldo · staging"
BACKUP_STORAGE_EMAIL = "bitwarden:Supabase · respaldo · staging"
BACKUP_STORAGE_PASSWORD = "bitwarden:Supabase · respaldo · staging"
R2_ACCOUNT_ID = "bitwarden:Cloudflare · R2 respaldos base"
R2_ACCESS_KEY_ID = "bitwarden:Cloudflare · R2 respaldos base"
R2_SECRET_ACCESS_KEY = "bitwarden:Cloudflare · R2 respaldos base"
AGE_PUBLIC_KEY = "bitwarden:age · respaldos"

# Secretos de las Edge Functions. SUPABASE_PROJECT_REF indica el proyecto y no se sube como secreto.
[supabase.staging]
SUPABASE_PROJECT_REF = "bitwarden:Supabase · proyecto · staging"
DATABASE_URL = "bitwarden:Supabase · api_login · staging"
RESEND_API_KEY = "bitwarden:Resend · API · staging"
VAPID_PRIVATE_KEY = "bitwarden:Web Push · VAPID · staging"
FCM_SERVICE_ACCOUNT = "bitwarden:Firebase · cuenta de servicio"
TURNSTILE_SECRET_KEY = "bitwarden:Cloudflare · Turnstile · staging"
OUTBOX_DISPATCH_TOKEN = "bitwarden:Supabase · outbox · staging"

[supabase.produccion]
SUPABASE_PROJECT_REF = "bitwarden:Supabase · proyecto · produccion"
DATABASE_URL = "bitwarden:Supabase · api_login · produccion"
RESEND_API_KEY = "bitwarden:Resend · API · produccion"
